<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Triage</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col items-center p-4">

    <h1 class="text-3xl font-extrabold text-white mt-6 mb-2 tracking-tight">Inventory <span class="text-emerald-400">Triage</span></h1>
    <p class="text-slate-400 text-sm mb-8">Warehouse Mapping Tool</p>

    <div class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden flex flex-col items-center justify-center p-4 aspect-square mb-6 relative">
        
        <p id="msg" class="text-slate-400 font-medium animate-pulse">Initial Load...</p>
        
        <img id="display-img" class="w-full h-full object-contain rounded-xl" style="display:none;">
    </div>
    
    <div class="h-12 flex items-center justify-center mb-4">
        <div id="status" class="text-emerald-400 font-semibold text-lg px-4 py-2 bg-emerald-400/10 rounded-lg border border-emerald-400/20">
            Ready to map.
        </div>
    </div>
    
    <div class="w-full max-w-md flex flex-col gap-4 px-2">
        
        <button id="mic-btn" onclick="startVoice()" 
            class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-95 transition-all duration-200 text-white py-5 rounded-2xl font-bold text-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] flex items-center justify-center gap-3">
            <span class="text-2xl">🎤</span> TAP & SPEAK
        </button>
        
        <button id="trash-btn" onclick="sendTrashCommand()" 
            class="w-full bg-slate-800 hover:bg-red-500/20 active:scale-95 transition-all duration-200 text-red-400 border-2 border-slate-700 hover:border-red-500/50 py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-3">
            <span>🗑️</span> TRASH IMAGE
        </button>
        
    </div>

    <script>
        const API_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; 
        // ... rest of your javascript ...
    <script>
        // CAREFULLY REPLACE THIS URL
        const API_URL = "https://script.google.com/macros/s/AKfycbz9nnpGQfoGwhj5r1KMC7l6Q57eShm02k7etc8L3DwQCqEBv_W3jvT8QCz3R3iTTvkioA/exec"; 
        let currentImageId = "";

        // Wait for page to fully load before firing (safer for mobile Safari/Chrome)
        document.addEventListener("DOMContentLoaded", () => {
            loadNext();
        });

        async function loadNext() {
            const img = document.getElementById('display-img');
            const msg = document.getElementById('msg');
            
            img.style.display = 'none';
            msg.style.display = 'block';
            msg.innerText = "Fetching next image...";

            try {
                const response = await fetch(API_URL + "?action=getNext");
                const file = await response.json();

                if (file && file.url) {
                    currentImageId = file.id;
                    img.src = file.url;
                    
                    img.onload = () => {
                        msg.style.display = 'none';
                        img.style.display = 'block';
                    };
                    
                    img.onerror = () => {
                        // Diagnostic text if the image is an incompatible format (like HEIC)
                        let format = file.url ? file.url.substring(0, 30) : "URL missing";
                        msg.innerText = "Browser refused to render.\nFormat: " + format + "...";
                        img.style.display = 'none';
                    };
                } else {
                    msg.innerText = "All images mapped or trashed!";
                }
            } catch (err) {
                msg.innerText = "Connection Error. Check API_URL.";
                console.error(err);
            }
        }

        async function sendTrashCommand() {
            const status = document.getElementById('status');
            if(!currentImageId) return; // Prevent clicking if no image loaded
            
            status.innerText = "Trashing...";
            status.style.color = "#ff4d4d";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ voiceInput: "trash", imageId: currentImageId })
                });
                const result = await response.json();
                
                if (result.success) {
                    status.innerText = result.productName;
                    setTimeout(() => { 
                        status.style.color = "#00ffcc";
                        loadNext(); 
                    }, 800);
                }
            } catch (err) {
                status.innerText = "Error trashing image.";
                console.error(err);
            }
        }

        function startVoice() {
            const status = document.getElementById('status');
            status.style.color = "#00ffcc";
            
            const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
            if (!SpeechRecognition) {
                status.innerText = "Mic API not supported on this browser.";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.onstart = () => { status.innerText = "Listening..."; };
            
            recognition.onresult = async (event) => {
                const voiceInput = event.results[0][0].transcript;
                status.innerText = "Processing: " + voiceInput;

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ voiceInput: voiceInput, imageId: currentImageId })
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        status.innerText = "Success: " + result.productName;
                        if (result.productName.includes("TRASH")) status.style.color = "#ff4d4d";
                        setTimeout(() => { 
                            status.style.color = "#00ffcc";
                            loadNext(); 
                        }, 1000);
                    } else {
                        status.innerText = "No match for '" + voiceInput + "'. Try again.";
                        status.style.color = "yellow";
                    }
                } catch (err) {
                    status.innerText = "Match error. Check connection.";
                    console.error(err);
                }
            };
            recognition.start();
        }
    </script>
</body>
</html>
