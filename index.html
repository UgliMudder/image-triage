<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Triage - GitHub Edition</title>
    <style>
        body { font-family: system-ui; text-align: center; background: #121212; color: white; padding: 20px; }
        #img-container { width: 100%; max-width: 500px; height: 400px; margin: 20px auto; background: #000; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 2px solid #333; overflow: hidden; }
        img { max-width: 100%; max-height: 100%; }
        #mic-btn { background: #e50914; color: white; border: none; padding: 30px; width: 80%; font-size: 1.5rem; border-radius: 50px; font-weight: bold; cursor: pointer; }
        #status { margin: 20px; color: #00ffcc; font-size: 1.2rem; min-height: 1.5em; }
    </style>
</head>
<body>

    <h1>Inventory Triage</h1>
    <div id="img-container">
        <p id="msg">Connecting to Google Sheets...</p>
        <img id="display-img" style="display:none;">
    </div>
    <div id="status">Ready to map.</div>
    <button id="mic-btn">🎤 TAP & SPEAK</button>

    <script>
        // PASTE YOUR GOOGLE WEB APP URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycby_50BTeTJBd6OvGo0M6SJK5827qsImOj6vr8rCjcuX6aC4unVyFI8-ecxg01NWhgrOKQ/exec"; 
        let currentImageId = "";

        window.onload = loadNext;

        async function loadNext() {
            document.getElementById('display-img').style.display = 'none';
            document.getElementById('msg').innerText = "Fetching next image...";
            
            const response = await fetch(`${API_URL}?action=getNext`);
            const file = await response.json();

            if (file) {
                currentImageId = file.id;
                const img = document.getElementById('display-img');
                img.src = file.url;
                img.onload = () => {
                    document.getElementById('msg').style.display = 'none';
                    img.style.display = 'block';
                };
            } else {
                document.body.innerHTML = "<h1>All mapped!</h1>";
            }
        }

        const btn = document.getElementById('mic-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        btn.onclick = () => recognition.start();

        recognition.onstart = () => document.getElementById('status').innerText = "Listening...";
        
        recognition.onresult = async (event) => {
            const voiceInput = event.results[0][0].transcript;
            document.getElementById('status').innerText = `Searching: ${voiceInput}`;

            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ voiceInput, imageId: currentImageId })
            });
            const result = await response.json();

            if (result.success) {
                document.getElementById('status').innerText = `Matched: ${result.productName}`;
                setTimeout(loadNext, 1000);
            } else {
                document.getElementById('status').innerText = "No match. Try again.";
            }
        };
    </script>
</body>
</html>
